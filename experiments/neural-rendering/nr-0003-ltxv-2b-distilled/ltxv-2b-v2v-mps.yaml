pipeline_type: base
checkpoint_path: "ltxv-2b-0.9.8-distilled.safetensors"
stg_mode: "attention_values"
decode_timestep: 0.05
decode_noise_scale: 0.025
text_encoder_model_name_or_path: "PixArt-alpha/PixArt-XL-2-1024-MS"
precision: "bfloat16"
sampler: "from_checkpoint"
prompt_enhancement_words_threshold: 0
prompt_enhancer_image_caption_model_name_or_path: "MiaoshouAI/Florence-2-large-PromptGen-v2.0"
prompt_enhancer_llm_model_name_or_path: "unsloth/Llama-3.2-3B-Instruct"
stochastic_sampling: false

# Stock LTX rejects video-to-video input when the initial timestep is 1.0,
# because that would replace the supplied frames with pure noise. The
# single-scale candidate keeps the distilled checkpoint schedule below 1.0.
# This conservative schedule is the structural baseline. It preserves the
# deterministic scene substantially better than the richer schedule, at the
# cost of adding little new material, texture, or lighting information.
timesteps: [0.7250, 0.4219]
guidance_scale: 1
stg_scale: 0
rescaling_scale: 1
skip_block_list: [42]
