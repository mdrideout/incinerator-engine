name: macOS gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.16.0
  VCPKG_DISABLE_METRICS: "1"

jobs:
  macos:
    name: macOS 15 / Apple Silicon
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install exact Zig
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl --fail --location --retry 3 \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz" \
            --output "$archive"
          echo "b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489  $archive" | shasum -a 256 --check
          tar -xf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"
          zig_cache="$RUNNER_TEMP/zig-global-cache"
          mkdir -p "$zig_cache/tmp"
          echo "ZIG_GLOBAL_CACHE_DIR=$zig_cache" >> "$GITHUB_ENV"

      - name: Install locked shader tools
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/shader-tools"
          vcpkg install \
            --x-manifest-root=tools/shader-toolchain \
            --x-install-root="$install_root" \
            --triplet=arm64-osx \
            --clean-after-build
          echo "GLSLC=$install_root/arm64-osx/tools/shaderc/glslc" >> "$GITHUB_ENV"
          echo "SPIRV_CROSS=$install_root/arm64-osx/tools/spirv-cross/spirv-cross" >> "$GITHUB_ENV"

      - name: Verify exact tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test "$(zig version)" = "$ZIG_VERSION"
          "$GLSLC" --version
          "$SPIRV_CROSS" --revision

      - name: Formatting
        shell: bash
        run: zig fmt --check build.zig build.zig.zon src tools third_party/joltc-zig

      - name: Cold headless product and lifecycle
        shell: bash
        run: |
          set -euo pipefail
          zig build -Dproduct=headless test --summary all
          prefix="$RUNNER_TEMP/incinerator-headless"
          zig build -Dproduct=headless -Doptimize=ReleaseFast \
            --prefix "$prefix" install-headless-product \
            verify-installed-headless-product test-m3-lifecycle --summary all
          if nm "$prefix/bin/incinerator_headless" | \
            grep -E '(_ecs_(http|rest|script|meta|json)|_Flecs(Http|Rest|Script|Meta|Json))'; then
            echo "unexpected Flecs service/reflection addon in headless product" >&2
            exit 1
          fi
          zig build -Dproduct=headless verify-cold-headless-product --summary all

      - name: M3 pre-server readiness measurement
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/m3-measure.json"
          zig build -Dproduct=headless -Doptimize=ReleaseFast \
            measure-m3 --summary none > "$report"
          jq -e '
            .schema_version == 2 and
            .gate == "m3-pre-server-readiness" and
            .mode == "routine" and
            .required_ticks == 32768 and .completed_ticks == 32768 and
            .cohorts.zig_version == "0.16.0" and
            .cohorts.optimize == "ReleaseFast" and
            .cohorts.target_arch == "aarch64" and
            .cohorts.target_os == "macos" and
            .performance.authority_tick.samples == 32768 and
            .performance.authority_tick.p99_ns <= .ceilings.p99_authority_tick_ns and
            .resources.allocator_final_live_bytes == 0 and
            .resources.allocator_peak_bytes <= .ceilings.allocator_peak_bytes and
            .resources.max_rss_bytes <= .ceilings.max_rss_bytes and
            .saturation.internal_outcome_queue_full and
            .saturation.internal_recovered and
            .saturation.producer_quota_full and
            .saturation.producer_ingress_full and
            .saturation.producer_transaction_table_full and
            .saturation.producer_result_capacity_full and
            .saturation.producer_recovered and
            .integrated_slices.active_districts == 2 and
            .integrated_slices.active_vehicles == 1 and
            .integrated_slices.active_npcs == 64 and
            .producer.completion_isolation and
            .producer_inventory.protocol_fault_handbacks == 0 and
            .producer_inventory.final_registered == 0 and
            .producer_inventory.final_unread_results == 0 and
            .final_ownership.renderer_or_gpu_resources == 0 and
            .final_ownership.live_worlds_after_cleanup == 0 and
            .final_ownership.live_authorities_after_cleanup == 0 and
            .final_ownership.native_ownership_released and
            .shutdown.accepted_work_drained and
            .shutdown.producers_unregistered and
            .shutdown.lifecycle_stopped and
            .shutdown.save_boundary_ready and
            .persistence.canonical_before_restart and
            .persistence.canonical_after_restore and
            .ceilings.all_passed
          ' "$report"
          cat "$report"

      - name: Tests without editor
        shell: bash
        run: >-
          zig build test -Deditor=false
          -Dglslc="$GLSLC" -Dspirv-cross="$SPIRV_CROSS"
          --summary all

      - name: M5 architecture boundary
        shell: bash
        run: >-
          zig build verify-m5-architecture -Deditor=false
          -Dglslc="$GLSLC" -Dspirv-cross="$SPIRV_CROSS"
          --summary all

      - name: Debug build with editor
        shell: bash
        run: >-
          zig build
          -Dglslc="$GLSLC" -Dspirv-cross="$SPIRV_CROSS"
          --summary all

      - name: ReleaseFast build without editor
        shell: bash
        run: |
          set -euo pipefail
          zig build test -Doptimize=ReleaseFast -Deditor=false \
            -Dglslc="$GLSLC" -Dspirv-cross="$SPIRV_CROSS" --summary all
          zig build -Doptimize=ReleaseFast -Deditor=false \
            -Dglslc="$GLSLC" -Dspirv-cross="$SPIRV_CROSS" --summary all
          if nm zig-out/bin/incinerator_engine | \
            grep -E '(_ecs_(http|rest|script|meta|json)|_Flecs(Http|Rest|Script|Meta|Json))'; then
            echo "unexpected Flecs service/reflection addon in client product" >&2
            exit 1
          fi

      - name: Relocatable install smoke
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/incinerator-install"
          zig build -Deditor=false \
            -Dglslc="$GLSLC" -Dspirv-cross="$SPIRV_CROSS" \
            --prefix "$prefix"
          cd "$RUNNER_TEMP"
          "$prefix/bin/incinerator_engine" --verify-install

      - name: Verify filtered source package
        shell: bash
        run: >-
          zig build verify-source-package -Deditor=false
          -Dglslc="$GLSLC" -Dspirv-cross="$SPIRV_CROSS"
          --summary all

      - name: Build leaves source tree unchanged
        shell: bash
        run: |
          set -euo pipefail
          test ! -e src/shaders/compiled
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
